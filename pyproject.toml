# Configuración de herramientas (este archivo no convierte el repo en paquete instalable).

[tool.pytest.ini_options]
# Permite "import secop" en los tests sin instalar nada.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores reales; I: orden de imports; B: errores comunes; UP: sintaxis moderna.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# En los notebooks de Databricks, spark, dbutils y display existen de forma
# global (los crea el entorno) y los imports van después de configurar sys.path.
"notebooks/*.py" = ["F821", "E402", "E501", "I001"]
